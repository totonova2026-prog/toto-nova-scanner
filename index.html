<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Toto Nova Barcode Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 520px;
      margin: auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.10);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .sub {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 480px;
      margin: 15px auto;
    }

    #status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      background: #f0f0f0;
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 22px;
      font-size: 17px;
      margin: 6px;
      cursor: pointer;
    }

    #start {
      background: #111111;
      color: white;
    }

    #stop {
      background: #dddddd;
      color: #111111;
    }

    .ok {
      color: #087a2f;
      font-weight: bold;
    }

    .err {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>TOTO NOVA</h1>

  <div class="sub">
    Mobile Barcode Scanner
  </div>

  <button id="start" onclick="startScanner()">
    📷 Scan Product
  </button>

  <button id="stop" onclick="stopScanner()">
    Stop
  </button>

  <div id="reader"></div>

  <div id="status">
    Tap <b>Scan Product</b> and allow camera access.
  </div>

</div>


<script>

let scanner = null;
let scanning = false;
let sent = false;


/* ------------------------------
   STATUS MESSAGE
-------------------------------- */

function setStatus(html) {

  document.getElementById("status").innerHTML = html;

}


/* ------------------------------
   START CAMERA
-------------------------------- */

function startScanner() {

  if (scanning) {
    return;
  }

  sent = false;

  document.getElementById("reader").innerHTML = "";

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,
      qrbox: {
        width: 280,
        height: 160
      }
    },

    onScanSuccess,

    function(errorMessage) {
      // Ignore normal scanning errors
    }

  )

  .then(function() {

    scanning = true;

    setStatus(
      "📷 Camera is ready.<br><br>" +
      "Point the camera at the Toto Nova barcode."
    );

  })

  .catch(function(error) {

    setStatus(
      '<span class="err">Camera could not start.</span>' +
      "<br><br>" +
      escapeHtml(String(error))
    );

  });

}


/* ------------------------------
   BARCODE FOUND
-------------------------------- */

function onScanSuccess(decodedText) {

  if (!scanning || sent) {
    return;
  }

  sent = true;
  scanning = false;

  const barcode = String(decodedText).trim();

  setStatus(
    "✅ Barcode detected:<br><br>" +
    "<b>" + escapeHtml(barcode) + "</b>" +
    "<br><br>" +
    "Sending to Toto Nova..."
  );


  if (scanner) {

    scanner.stop()

      .catch(function() {})

      .finally(function() {

        sendBarcode(barcode);

      });

  } else {

    sendBarcode(barcode);

  }

}


/* ------------------------------
   SEND BARCODE TO TOTO NOVA
-------------------------------- */

function sendBarcode(barcode) {

  /*
     Send barcode to the Toto Nova
     Apps Script page.
  */

  if (window.opener && !window.opener.closed) {

    window.opener.postMessage(

      {
        type: "TOTO_NOVA_BARCODE",
        barcode: barcode
      },

      "*"

    );

    setStatus(

      '<span class="ok">✅ Barcode sent to Toto Nova</span>' +
      "<br><br>" +
      "Barcode: <b>" +
      escapeHtml(barcode) +
      "</b>" +
      "<br><br>" +
      "Return to the Toto Nova screen."

    );

    return;
  }


  /*
     If the scanner was opened as a
     normal phone tab, window.opener
     may not exist.

     In that case save the barcode
     and show instructions.
  */

  try {

    localStorage.setItem(
      "TOTO_NOVA_BARCODE",
      barcode
    );

  } catch (e) {}


  setStatus(

    '<span class="ok">✅ Barcode detected</span>' +
    "<br><br>" +

    "Barcode: <b>" +
    escapeHtml(barcode) +
    "</b>" +

    "<br><br>" +

    "Return to the Toto Nova screen."

  );

}


/* ------------------------------
   STOP CAMERA
-------------------------------- */

function stopScanner() {

  if (scanner && scanning) {

    scanner.stop()
      .catch(function() {});

  }

  scanning = false;
  sent = false;

  setStatus(
    "Scanner stopped.<br><br>" +
    "Tap <b>Scan Product</b> to start again."
  );

}


/* ------------------------------
   SECURITY / HTML ESCAPE
-------------------------------- */

function escapeHtml(value) {

  return String(value).replace(
    /[&<>"']/g,
    function(m) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

      }[m];

    }
  );

}

</script>

</body>
</html>
